# The manual's figures (core #2165): the video host's real pages, shot from the client check's stack and handed over as an
# artifact to commit under manual/screenshots. By hand or on a change to the capture, never on a schedule: a figure changes
# the committed PDF, and the core files a new version of a manual whose bytes changed (core ADR 0891).
name: Manual figures

on:
  pull_request:
    paths: ["tools/figures/**", ".github/workflows/manual-figures.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./tools/client-check/stack
      - name: Shoot the pages
        run: tools/figures/capture.sh "$RUNNER_TEMP/figures"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-figures
          path: ${{ runner.temp }}/figures/*.png
          if-no-files-found: error
      - name: The stack's log, for a failure
        if: ${{ failure() }}
        working-directory: tools/client-check
        run: docker compose logs --no-color api | tail -100
      - name: Stop the stack
        if: ${{ always() }}
        working-directory: tools/client-check
        run: docker compose down -v
