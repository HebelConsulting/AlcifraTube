# The weekly client check (core #2142): do the clients people install today still reach this module? Self-contained in
# the runner: the released core image, Postgres and the object store, the module built from this commit, one seeded clip
# (tools/client-check/stack). Then the real clients at their newest release, through their own code: the official app's
# parsers and NewPipe's extractor on the runner, and the app itself on an Android emulator, adding the server and playing
# the clip. A failure opens one issue per client, because a red scheduled run alone goes unnoticed; the next green run
# closes it.
#
# Two jobs, each with its own stack: the parsers and the extractor take eight minutes, the emulator walk half an hour, and
# a flaky emulator must not colour the parsers' verdict. Standard hosted runners only: free in a public repository, and the
# Linux ones carry KVM, which is what makes an emulator run at all.
#
# GitHub disables a scheduled workflow after 60 days without activity in a public repository, silently. The core's own
# weekly probe re-enables this one, so the two watch each other.
name: Client check

on:
  schedule:
    - cron: "37 6 * * 1"   # Mondays, after the demo's reset window; nothing here reaches the demo anyway
  # A change to the check itself runs it on the pull request, which is also how a new workflow gets its first run: a
  # dispatch works only from the default branch. A pull request run opens no issue.
  pull_request:
    paths: ["tools/client-check/**", ".github/workflows/client-check.yml"]
  workflow_dispatch:
    inputs:
      core_version:
        description: "The core image tag to run (a released version, or latest)"
        default: latest

permissions:
  contents: read
  issues: write

env:
  CORE_VERSION: ${{ inputs.core_version || 'latest' }}
  CHECK_HOST: https://tube.test

jobs:
  # ---- The clients' own code on the runner: NewPipe's extractor, the app's parsers -------------------------------------
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./tools/client-check/stack
        with:
          core-version: ${{ env.CORE_VERSION }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: NewPipe extractor
        id: newpipe
        continue-on-error: true
        working-directory: tools/client-check/newpipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A copy of the JDK's trust store with the edge's root added, handed to every JVM of this step: the public roots
          # stay (the dependencies download over TLS), the JDK itself stays untouched.
          cp "$JAVA_HOME/lib/security/cacerts" "$RUNNER_TEMP/cacerts"
          chmod u+w "$RUNNER_TEMP/cacerts"
          keytool -importcert -noprompt -alias edge-ca -file "$CHECK_CA" -keystore "$RUNNER_TEMP/cacerts" -storepass changeit
          export JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStore=$RUNNER_TEMP/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          version=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)
          echo "newest NewPipeExtractor release: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gradle --no-daemon --console=plain run -PnewpipeVersion="$version" --args="$CHECK_HOST $version"

      - name: Check out the app at its newest release
        id: app
        run: |
          set -euo pipefail
          tag=$(tools/client-check/app/checkout.sh)
          echo "newest app release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: The app's parsers
        id: app-parsers
        continue-on-error: true
        working-directory: app
        env:
          ALCIFRA_CHECK_HOST: ${{ env.CHECK_HOST }}
          ALCIFRA_CHECK_CA: ${{ env.CHECK_CA }}
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          cp ../tools/client-check/app/alcifra_contract_test.dart test/
          flutter test test/alcifra_contract_test.dart

      - name: Report NewPipe
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.newpipe.outcome }}
          VERSION: ${{ steps.newpipe.outputs.version }}
        run: tools/client-check/report.sh "NewPipe" "NewPipeExtractor $VERSION" "$OUTCOME"
      - name: Report the app
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.app-parsers.outcome }}
          VERSION: ${{ steps.app.outputs.tag }}
        run: tools/client-check/report.sh "the PeerTube app" "the app at $VERSION" "$OUTCOME"
      - name: Fail when a client failed
        if: ${{ always() }}
        run: |
          [ "${{ steps.newpipe.outcome }}" = success ] && [ "${{ steps.app-parsers.outcome }}" = success ]

      - name: The stack's log, for a failure
        if: ${{ failure() }}
        working-directory: tools/client-check
        run: docker compose logs --no-color api | tail -200
      - name: Stop the stack
        if: ${{ always() }}
        working-directory: tools/client-check
        run: docker compose down -v

  # ---- The app itself, on an emulator: add the server, open the clip, watch it play ----------------------------------
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./tools/client-check/stack
        id: stack
        with:
          core-version: ${{ env.CORE_VERSION }}

      - name: Check out the app at its newest release
        id: app
        run: |
          set -euo pipefail
          tag=$(tools/client-check/app/checkout.sh)
          echo "newest app release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      # The walk is the app's own integration test for the run: its harness is added to the checkout, the test copied in.
      - name: The app's models, and the walk as its integration test
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter pub add dev:integration_test --sdk=flutter
          mkdir -p integration_test
          cp ../tools/client-check/app/alcifra_walk_test.dart integration_test/

      # The hosted Linux runner has KVM; the emulator needs the device readable.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 33, because the system trust store is still a directory there (emulator/trust-edge.sh); google_apis, because
      # that image allows adb root and a Play image does not. The app's release signing reads three variables at Gradle's
      # configuration time even for a debug build; placeholders keep that step from failing on a keystore this run never uses.
      - name: The emulator walk
        id: app-walk
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          PEERTUBE_KEYSTORE_PATH: /dev/null
          PEERTUBE_KEYSTORE_PASSWORD: unused
          PEERTUBE_KEY_ALIAS: unused
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          # One line: the runner runs each line of this input as its own shell.
          script: tools/client-check/emulator/walk.sh "${{ steps.stack.outputs.ca }}" tube.test

      - name: Report the walk
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.app-walk.outcome }}
          VERSION: ${{ steps.app.outputs.tag }}
        run: tools/client-check/report.sh "the PeerTube app on an emulator" "the app at $VERSION, walked on an Android 13 emulator" "$OUTCOME"
      - name: Fail when the walk failed
        if: ${{ always() }}
        run: |
          [ "${{ steps.app-walk.outcome }}" = success ]

      - name: The stack's log, for a failure
        if: ${{ failure() }}
        working-directory: tools/client-check
        run: docker compose logs --no-color api edge | tail -300
      - name: Stop the stack
        if: ${{ always() }}
        working-directory: tools/client-check
        run: docker compose down -v
